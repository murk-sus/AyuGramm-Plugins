name: Catalog

on:
  push:
    branches: [main]
    paths: ["plugins/**", "tools/**", ".github/workflows/index.yml"]
  pull_request:
    paths: ["plugins/**", "tools/**"]

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test plugins
        run: node tools/test_plugins.js
      - name: Validate headers, permissions and checksums
        run: node tools/validate.mjs
      - name: Build index.json
        run: python3 tools/build_index.py
      - name: Commit index.json
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "Rebuild index.json"
            git push
          fi
